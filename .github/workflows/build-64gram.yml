name: Build Windows (64Gram + unlimited accounts)

# Builds 64Gram (TDesktop-x64/tdesktop) at tag v1.2.12 — the exact same version
# users already have — with one tiny patch that lifts the account limit
# (100 -> practically unlimited, 999/1000).
#
# Recipe mirrors the PROVEN 64Gram CI (win.yml):
#   - windows-latest runner
#   - toolset 14.44 (v143-based; keeps Windows 7 support, and includes the ATL
#     component that the default v145 toolset lacks — so the breakpad prepare
#     stage builds fine, exactly like 64Gram's own CI)
#   - SDK 10.0.26100.0
#   - Release x64 with autoupdate disabled (otherwise the app would replace
#     itself with an official 64Gram build and the limit would come back).
#
# Caching note: prepare.py FORCES a rebuild when explicit stage names are passed
# ("Forced" bypasses cache keys). Therefore:
#   - The base-libs pass (named stages) only runs when no base cache exists yet.
#   - Everything else goes through a full `win.bat silent`, which respects
#     Libraries/win64/cache_keys and skips what is already built.

on:
  workflow_dispatch:
  push:
    tags:
      - 'gram-v*'

concurrency:
  group: build-64gram
  cancel-in-progress: false

env:
  # 64Gram's own open API credentials (the same pair their nightly builds use),
  # so login works exactly like the official 64Gram app — users never need api_id/api_hash.
  TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID_64GRAM || '611335' }}
  TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH_64GRAM || 'd524b414d21f4d37f08684c1df41ac9c' }}
  GRAM_REF: 'v1.2.12'

jobs:

  # ---------------------------------------------------------------
  # Job 1: prepare third-party libraries for win64.
  # Base libs are cached as soon as they are ready; the long Qt build
  # continues afterwards. A retry skips straight to Qt.
  # ---------------------------------------------------------------
  libraries:
    name: Libraries (win64)
    runs-on: windows-latest
    timeout-minutes: 350
    defaults:
      run:
        shell: cmd
    steps:

      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Clone 64Gram (%GRAM_REF%).
        run: |
          git -c core.autocrlf=false clone --depth 1 --branch %GRAM_REF% --recurse-submodules --shallow-submodules https://github.com/TDesktop-x64/tdesktop.git %TBUILD%\tdesktop

      - name: Compute cache key (prepare scripts hash + week number).
        shell: bash
        run: |
          WEEK=$(date +%G-W%V)
          WS=$(cygpath -u "$GITHUB_WORKSPACE")
          PREP="$WS/TBuild/tdesktop/Telegram/build/prepare"
          CACHE_KEY=$(cat "$PREP/prepare.py" "$PREP/win.bat" "$PREP/msvc.py" 2>/dev/null | sha256sum | awk '{ print $1 }')
          if [ -z "$CACHE_KEY" ]; then CACHE_KEY="fallback-$WEEK"; fi
          echo "WEEK=$WEEK" >> $GITHUB_ENV
          echo "CACHE_KEY=$CACHE_KEY" >> $GITHUB_ENV

      - name: Native Tools Command Prompt (toolset 14.44, SDK 26100).
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          sdk: 10.0.26100.0
          toolset: 14.44

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: Restore ThirdParty cache.
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: win-64gram-thirdparty-${{ env.CACHE_KEY }}-${{ env.WEEK }}-${{ github.run_id }}-attempt${{ github.run_attempt }}
          restore-keys: win-64gram-thirdparty-${{ env.CACHE_KEY }}-

      - name: Restore Libraries cache (base, without Qt).
        id: libs_base
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t_*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t_*
          key: win-64gram-libs-base-${{ env.CACHE_KEY }}-${{ env.WEEK }}-${{ github.run_id }}-attempt${{ github.run_attempt }}
          restore-keys: win-64gram-libs-base-${{ env.CACHE_KEY }}-

      # prepare.py FORCES a rebuild for explicitly named stages, so on a cache
      # hit we skip this pass entirely instead of needlessly rebuilding base libs.
      - name: Libraries (base stages).
        env:
          BASE_HIT: ${{ steps.libs_base.outputs.cache-matched-key }}
        run: |
          if not "%BASE_HIT%"=="" (
            echo Base libraries restored from cache - skipping base prepare.
            exit /b 0
          )
          call %TBUILD%\tdesktop\Telegram\build\prepare\win.bat silent patches msys64 python NuGet jom rust lzma zlib mozjpeg openssl3 opus rnnoise gas-preprocessor dav1d openh264 libavif libwebp libjxl libvpx liblcms2 nv-codec-headers regex ffmpeg libheif openal-soft crashpad tg_owt ada tde2e tlottie wallet-engine tdesktop_rust
          if %errorlevel% neq 0 (
            echo Base stage list failed, running full prepare instead...
            call %TBUILD%\tdesktop\Telegram\build\prepare\win.bat silent
          )

      - name: Free up some disk space (base).
        shell: bash
        run: |
          LP=$(cygpath -u "$LibrariesPath")
          find "$LP" '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete

      - name: Save Libraries cache (base).
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t_*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t_*
          key: win-64gram-libs-base-${{ env.CACHE_KEY }}-${{ env.WEEK }}-${{ github.run_id }}-attempt${{ github.run_attempt }}

      # Full prepare: cached stages skip via cache_keys; Qt trio (qt6_windows7,
      # tg_angle, qt_6.x) plus anything missing gets built here.
      - name: Libraries (Qt).
        run: |
          call %TBUILD%\tdesktop\Telegram\build\prepare\win.bat silent

      - name: Free up some disk space (Qt).
        shell: bash
        run: |
          LP=$(cygpath -u "$LibrariesPath")
          find "$LP" '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete

      - name: Save ThirdParty cache.
        uses: actions/cache/save@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: win-64gram-thirdparty-${{ env.CACHE_KEY }}-${{ env.WEEK }}-${{ github.run_id }}-attempt${{ github.run_attempt }}

      - name: Save Libraries cache (Qt).
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t_*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t_*
          key: win-64gram-libs-qt-${{ env.CACHE_KEY }}-${{ env.WEEK }}-${{ github.run_id }}-attempt${{ github.run_attempt }}

  # ---------------------------------------------------------------
  # Job 2: clone 64Gram v1.2.12, apply the unlimited-accounts patch,
  # configure and build Release x64, upload artifact.
  # ---------------------------------------------------------------
  build:
    name: Build 64Gram (Release x64)
    needs: libraries
    runs-on: windows-latest
    timeout-minutes: 350
    defaults:
      run:
        shell: cmd
    steps:

      - name: Checkout this repository (for the patch).
        uses: actions/checkout@v7

      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Clone 64Gram (%GRAM_REF%, recursive shallow submodules).
        run: |
          git -c core.autocrlf=false clone --depth 1 --branch %GRAM_REF% --recurse-submodules --shallow-submodules https://github.com/TDesktop-x64/tdesktop.git %TBUILD%\tdesktop

      - name: Apply unlimited-accounts patch.
        run: |
          git -C %TBUILD%\tdesktop apply --whitespace=nowarn %GITHUB_WORKSPACE%\patches\unlimited-accounts-64gram.patch || python %GITHUB_WORKSPACE%\patches\fallback-patch-64gram.py %TBUILD%\tdesktop

      - name: Verify patch applied (all 4 limit points).
        run: |
          findstr /C:"kMaxAccounts = 999" %TBUILD%\tdesktop\Telegram\SourceFiles\main\main_domain.h || exit /b 1
          findstr /C:"kPremiumMaxAccounts = 1000" %TBUILD%\tdesktop\Telegram\SourceFiles\main\main_domain.h || exit /b 1
          findstr /C:"return 999;" %TBUILD%\tdesktop\Telegram\SourceFiles\main\main_domain.cpp || exit /b 1
          findstr /C:"size() >= 999" %TBUILD%\tdesktop\Telegram\SourceFiles\settings\sections\settings_information.cpp || exit /b 1
          findstr /C:"defaultLimit = 999" %TBUILD%\tdesktop\Telegram\SourceFiles\boxes\premium_limits_box.cpp || exit /b 1

      - name: Compute cache key (prepare scripts hash + week number).
        shell: bash
        run: |
          WEEK=$(date +%G-W%V)
          WS=$(cygpath -u "$GITHUB_WORKSPACE")
          PREP="$WS/TBuild/tdesktop/Telegram/build/prepare"
          CACHE_KEY=$(cat "$PREP/prepare.py" "$PREP/win.bat" "$PREP/msvc.py" 2>/dev/null | sha256sum | awk '{ print $1 }')
          if [ -z "$CACHE_KEY" ]; then CACHE_KEY="fallback-$WEEK"; fi
          echo "WEEK=$WEEK" >> $GITHUB_ENV
          echo "CACHE_KEY=$CACHE_KEY" >> $GITHUB_ENV

      - name: Native Tools Command Prompt (toolset 14.44, SDK 26100).
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          sdk: 10.0.26100.0
          toolset: 14.44

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: Restore ThirdParty cache.
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: win-64gram-thirdparty-not-used-${{ github.run_id }}
          restore-keys: win-64gram-thirdparty-${{ env.CACHE_KEY }}-

      - name: Restore Libraries cache (base, without Qt).
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t_*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t_*
          key: win-64gram-libs-base-not-used-${{ github.run_id }}
          restore-keys: win-64gram-libs-base-${{ env.CACHE_KEY }}-

      - name: Restore Libraries cache (Qt).
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t_*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t_*
          key: win-64gram-libs-qt-not-used-${{ github.run_id }}
          restore-keys: win-64gram-libs-qt-${{ env.CACHE_KEY }}-

      - name: Sync libraries (skips everything already cached).
        run: |
          call %TBUILD%\tdesktop\Telegram\build\prepare\win.bat silent

      - name: 64Gram build (Release x64).
        run: |
          cd %TBUILD%\tdesktop\Telegram

          call configure.bat x64 ^
            -D TDESKTOP_API_ID=%TDESKTOP_API_ID% ^
            -D TDESKTOP_API_HASH=%TDESKTOP_API_HASH% ^
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
            -D CMAKE_CONFIGURATION_TYPES=Release

          cmake --build ..\out --config Release --parallel

      - name: Collect artifact.
        run: |
          set OUT=%TBUILD%\tdesktop\out\Release
          mkdir %GITHUB_WORKSPACE%\artifact
          if exist %OUT%\Telegram.exe move %OUT%\Telegram.exe %GITHUB_WORKSPACE%\artifact\
          if exist %OUT%\64Gram.exe move %OUT%\64Gram.exe %GITHUB_WORKSPACE%\artifact\
          if exist %OUT%\Updater.exe move %OUT%\Updater.exe %GITHUB_WORKSPACE%\artifact\
          powershell -NoProfile -Command "Compress-Archive -Path '%GITHUB_WORKSPACE%\artifact\*' -DestinationPath '%GITHUB_WORKSPACE%\64Gram-unlimited-accounts-win64.zip' -Force"

      - uses: actions/upload-artifact@v7
        name: Upload artifact.
        with:
          name: windows-exe-64gram
          path: ${{ github.workspace }}\64Gram-unlimited-accounts-win64.zip
          retention-days: 14
          if-no-files-found: error
