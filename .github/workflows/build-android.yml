# ============================================================
# Telegram Android (Unlimited Accounts) — official source build
# Source: DrKLO/Telegram master (official Telegram for Android)
# Patch : UserConfig.MAX_ACCOUNT_COUNT 4 -> 999 (unlimited accounts)
# Optional inputs let you build a SECOND standalone app (different
# applicationId + label) that installs alongside the official one.
# Output: Telegram-Android-Unlimited.apk (afatRelease, all ABIs,
#         signed with the repo's public release keystore)
# ============================================================

name: build-android-apk

on:
  workflow_dispatch:
    inputs:
      app_package:
        description: 'applicationId (keep org.telegram.messenger to update first APK; use a unique id for a second standalone app)'
        required: false
        default: 'org.telegram.messenger'
      app_label:
        description: 'launcher label (AppName string resource)'
        required: false
        default: 'Telegram'
      version_suffix:
        description: 'APP_VERSION_NAME suffix'
        required: false
        default: '-Unlimited'
      apk_name:
        description: 'output APK file name'
        required: false
        default: 'Telegram-Android-Unlimited.apk'
      artifact_name:
        description: 'CI artifact name'
        required: false
        default: 'android-apk'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PKG: ${{ inputs.app_package || 'org.telegram.messenger' }}
      LABEL: ${{ inputs.app_label || 'Telegram' }}
      VSUFFIX: ${{ inputs.version_suffix || '-Unlimited' }}
      APKNAME: ${{ inputs.apk_name || 'Telegram-Android-Unlimited.apk' }}
    steps:
      - name: Checkout official Telegram source
        uses: actions/checkout@v4
        with:
          repository: DrKLO/Telegram
          ref: master
          fetch-depth: 1
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install exact SDK components (compileSdk 36 / NDK 27.2 / CMake 3.22.1)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          # ubuntu-latest ships a full Android SDK; android-actions/setup-android@v3
          # currently fails on the removed legacy 'tools' package, so use the
          # preinstalled sdkmanager directly.
          SDKM="$ANDROID_HOME/cmdline-tools/$(ls "$ANDROID_HOME/cmdline-tools" | head -1)/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null
          "$SDKM" --list_installed

      - name: Patch unlimited accounts + standalone identity
        run: |
          set -e
          # 1) Unlimited accounts (official limit is 4)
          F=TMessagesProj/src/main/java/org/telegram/messenger/UserConfig.java
          sed -i 's/public final static int MAX_ACCOUNT_COUNT = 4;/public final static int MAX_ACCOUNT_COUNT = 999;/' "$F"
          grep -n "MAX_ACCOUNT_COUNT = " "$F" | head -1

          # 2) Version suffix (build marker)
          sed -i "s/^APP_VERSION_NAME=.*/APP_VERSION_NAME=13.2.2$VSUFFIX/" gradle.properties
          grep -n "APP_VERSION_NAME" gradle.properties

          # 3) Second standalone app: unique applicationId + matching Firebase
          #    client config (plugin refuses mismatched packages). Manifest
          #    authorities/permissions already use \${applicationId} so parallel
          #    install stays safe. Launcher label is renamed too.
          if [ "$PKG" != "org.telegram.messenger" ]; then
            sed -i "s/^APP_PACKAGE=.*/APP_PACKAGE=$PKG/" gradle.properties
            for G in TMessagesProj/google-services.json TMessagesProj_App/google-services.json; do
              sed -i "s/\"package_name\": \"org.telegram.messenger\"/\"package_name\": \"$PKG\"/" "$G"
            done
            grep -n "package_name" TMessagesProj_App/google-services.json | head -3
          fi
          if [ "$LABEL" != "Telegram" ]; then
            S=TMessagesProj/src/main/res/values/strings.xml
            sed -i "0,/<string name=\"AppName\">.*<\/string>/s//<string name=\"AppName\">$LABEL<\/string>/" "$S"
            grep -n 'name="AppName"' "$S" | head -1
          fi
          grep -n "APP_PACKAGE" gradle.properties

      - name: Build afatRelease APK (all ABIs, signed)
        run: |
          ./gradlew :TMessagesProj_App:assembleAfatRelease --stacktrace

      - name: Collect APK
        run: |
          ls -la TMessagesProj_App/build/outputs/apk/afat/release/
          cp TMessagesProj_App/build/outputs/apk/afat/release/app.apk "$APKNAME"
          sha256sum "$APKNAME"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name || 'android-apk' }}
          path: ${{ inputs.apk_name || 'Telegram-Android-Unlimited.apk' }}
          retention-days: 30
