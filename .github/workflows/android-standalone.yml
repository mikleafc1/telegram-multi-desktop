# ============================================================
# Telegram Android #2 — OFFICIAL standalone module build
# Uses TMessagesProj_AppStandalone (the sanctioned pipeline for an
# app that installs ALONGSIDE official Telegram):
#   applicationId = org.telegram.messenger.web (suffix from gradle)
#   namespace     = org.telegram.messenger.web
#   isStandalone()=true impl, official standalone manifest/icons
# Patch: UserConfig.MAX_ACCOUNT_COUNT 4 -> 999 + label rename
# ============================================================

name: android-standalone-apk

on:
  workflow_dispatch:

jobs:
  build-standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout official Telegram source
        uses: actions/checkout@v4
        with:
          repository: DrKLO/Telegram
          ref: master
          fetch-depth: 1
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install exact SDK components
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/$(ls "$ANDROID_HOME/cmdline-tools" | head -1)/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null
          "$SDKM" --list_installed

      - name: Patch unlimited accounts + label
        run: |
          set -e
          F=TMessagesProj/src/main/java/org/telegram/messenger/UserConfig.java
          sed -i 's/public final static int MAX_ACCOUNT_COUNT = 4;/public final static int MAX_ACCOUNT_COUNT = 999;/' "$F"
          grep -n "MAX_ACCOUNT_COUNT = " "$F" | head -1
          sed -i 's/^APP_VERSION_NAME=.*/APP_VERSION_NAME=13.2.2-Unlimited2/' gradle.properties
          grep -n "APP_VERSION_NAME\|APP_PACKAGE" gradle.properties
          S=TMessagesProj/src/main/res/values/strings.xml
          sed -i 's|<string name="AppName">Telegram</string>|<string name="AppName">Telegram Unlimited 2</string>|' "$S"
          grep -n 'name="AppName"' "$S" | head -1

      - name: Build official standalone APK (afatStandalone, all ABIs, signed)
        run: |
          ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone --stacktrace

      - name: Collect APK
        run: |
          ls -la TMessagesProj_AppStandalone/build/outputs/apk/afat/standalone/ || ls -la TMessagesProj_AppStandalone/build/outputs/apk/
          cp TMessagesProj_AppStandalone/build/outputs/apk/afat/standalone/app.apk Telegram2-Android-Unlimited.apk
          sha256sum Telegram2-Android-Unlimited.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-standalone
          path: Telegram2-Android-Unlimited.apk
          retention-days: 30
