name: Build Windows (official tdesktop + unlimited accounts)

# Builds the OFFICIAL Telegram Desktop (dev branch) with a single tiny patch
# that lifts the 3-account limit to (practically) unlimited.
# Recipe adapted from the proven 64Gram CI (TDesktop-x64/tdesktop, win.yml)
# targeting upstream telegramdesktop/tdesktop instead of a fork.
# Runner fixes so far: (run 7) checkout was missing in the libraries job;
# (run 8) the disk filled while INSTALLING Debug Qt -> the runner image is
# trimmed first and the Qt stage is patched to install RelWithDebInfo only.
# (run 9) Libraries job finally succeeded, but the build job died with
# "Neither Qt6 nor Qt5 is found": the Qt stage INSTALLS into
# Libraries/win64/Qt-6.11.2 (hyphen!), which the cache glob [qQ]t_* does NOT
# match (underscore vs hyphen) -> CMake prefix path pointed at a missing
# folder. The installed Qt dir is now included via [qQ]t-* in both the save
# and the restore paths.
# (run 10) configure finally found Qt, but died on
# Libraries/win64/tdesktop_rust/out/src/wallet_engine/wallet_engine.cpp:
# the aggressive trim in the libraries job had deleted the .cpp glue and the
# .rs/.toml sources of tlottie / wallet-engine / tdesktop_rust while their
# stage keys stayed valid (upstream prepare.py even documents this exact
# failure mode for its own CI prune). The trim is now the proven 64Gram
# recipe: delete only *.obj *.pdb *.pch *.ilk (+ .git dirs), and the Rust
# trio is force-rebuilt over the damaged cache before the base cache is
# saved, so the cached copies are complete again.
# (run 10) configure finally found Qt, but died on
# Libraries/win64/tdesktop_rust/out/src/wallet_engine/wallet_engine.cpp:
# the aggressive trim in the libraries job had deleted the .cpp glue and the
# .rs/.toml sources of tlottie / wallet-engine / tdesktop_rust while their
# stage keys stayed valid (upstream prepare.py even documents this exact
# failure mode for its own CI prune). The trim is now the proven 64Gram
# recipe: delete only *.obj *.pdb *.pch *.ilk (+ .git dirs), and the Rust
# trio is force-rebuilt over the damaged cache before the base cache is
# saved, so the cached copies are complete again.
# (run 16) Build job died with C1085 "No space left on device" while writing
# Telegram.dir/Release/*.obj (42 GB free was still not enough).
# (run 17) Build job got all the way to the FINAL Telegram.exe link and died
# with LNK1102 "out of memory". Root cause found in desktop-app/cmake_helpers
# variables.cmake: CMAKE_MSVC_DEBUG_INFORMATION_FORMAT is hard-set to
# "$<$<CONFIG:Debug>:ProgramDatabase>$<$<NOT:$<CONFIG:Debug>>:Embedded>" ->
# EVERY Release object carries full /Z7 debug info, and the final link must
# merge all of it in RAM (LNK1102) while the bloated objects eat the disk
# (run 16's C1085). Fix = the proven 64Gram CI recipe: pass
# -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= (empty -> no debug info anywhere;
# the command-line -D creates the cache entry first, so helpers' set(CACHE)
# can no longer override it) and strip the ${_Zi} default from
# Windows-MSVC.cmake. 64Gram ships its released exe exactly this way.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: build-windows
  cancel-in-progress: false

env:
  # Public credentials of the official Telegram Desktop client.
  # Overridable via repository secrets TDESKTOP_API_ID / TDESKTOP_API_HASH.
  TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID || '6' }}
  TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH || 'eb06d4abfb49dc3eeb1aeb98ae0f581e' }}

jobs:

  # ---------------------------------------------------------------
  # Job 1: prepare all third-party libraries for win64 (Debug+Release
  # variants are both built by upstream prepare.py unless skip-release
  # is passed; we need Release variants to link a Release Telegram.exe).
  # Split into two prepare passes so that a cache of the "base" libs is
  # persisted even if the long Qt build later hits the job timeout.
  # ---------------------------------------------------------------
  libraries:
    name: Libraries (win64)
    runs-on: windows-latest
    timeout-minutes: 350
    defaults:
      run:
        shell: cmd
    steps:

      # Needed so %GITHUB_WORKSPACE%\patches\remove-breakpad-stage.py exists.
      # (run 7 failed exactly here: the patches folder was never checked out
      #  in this job, so python could not open the script.)
      - name: Checkout this repository (for the patches).
        uses: actions/checkout@v7

      # Run 8 died with "No space left on device" while installing Debug Qt.
      # Remove preinstalled SDKs/toolchains this build never uses (TBuild
      # itself lives on C:, the small system drive of the runner).
      - name: Free up disk space on the runner.
        shell: powershell
        run: |
          $before = [math]::Round((Get-PSDrive C).Free / 1GB, 1)
          Write-Host "Free space on C: before cleanup: $before GB"
          $targets = @(
            'C:\Program Files\Android',
            'C:\Program Files (x86)\Android',
            'C:\Users\runneradmin\AppData\Local\Android',
            'C:\hostedtoolcache\windows\go',
            'C:\hostedtoolcache\windows\Ruby',
            'C:\hostedtoolcache\windows\PyPy',
            'C:\hostedtoolcache\windows\stack',
            'C:\hostedtoolcache\windows\ghc',
            'C:\hostedtoolcache\windows\CodeQL',
            'C:\hostedtoolcache\windows\Java_Temurin-Hotspot_jdk*',
            'C:\hostedtoolcache\windows\dotnet',
            'C:\ProgramData\DockerDesktop',
            'C:\Users\runneradmin\.docker',
            'C:\Program Files\Mozilla Firefox',
            'C:\Program Files (x86)\Mozilla Firefox',
            'C:\Program Files\Google\Chrome',
            'C:\Program Files (x86)\Google\Chrome',
            'C:\Program Files\MySQL',
            'C:\ProgramData\MySQL',
            'C:\Program Files\PostgreSQL',
            'C:\ProgramData\PostgreSQL',
            'C:\Users\runneradmin\.rustup',
            'C:\Users\runneradmin\.cargo',
            'C:\Users\runneradmin\.gradle',
            'C:\Users\runneradmin\.m2',
            'C:\Users\runneradmin\.npm',
            'C:\Users\runneradmin\.nuget',
            'C:\ProgramData\Microsoft Visual Studio\Packages',
            'C:\Users\runneradmin\AppData\Local\Docker',
            'C:\ProgramData\chocolatey',
            'C:\SeleniumWebDrivers',
            'C:\ghcup',
            'C:\cabal',
            'C:\mingw64',
            'C:\vcpkg',
            'C:\Strawberry',
            'C:\Users\runneradmin\AppData\Local\wsl',
            'C:\Users\runneradmin\AppData\Local\Packages\CanonicalGroupLimited*',
            'C:\Users\runneradmin\AppData\Local\pip\cache',
            'C:\Users\runneradmin\AppData\Local\Google\Chrome',
            'C:\ProgramData\Google',
            'C:\ProgramData\Mozilla'
          )
          foreach ($t in $targets) {
            if (Test-Path $t) {
              try {
                Remove-Item -Recurse -Force $t -ErrorAction Stop
                Write-Host "removed: $t"
              } catch {
                Write-Host "could not remove ${t}: $($_.Exception.Message)"
              }
            }
          }
          $after = [math]::Round((Get-PSDrive C).Free / 1GB, 1)
          Write-Host "Free space on C: after cleanup: $after GB (freed $([math]::Round($after - $before, 1)) GB)"

      # Run 16 died with C1085/MSB6003 "No space left on device" deep inside
      # Telegram.vcxproj: even after the trim C: had only 42 GB free and the
      # main build consumed ALL of it. The runner also exposes a large data
      # drive (D: — the workspace itself lives there), so put the REAL
      # TBuild tree on whichever drive currently has more free space. The
      # env vars below are unchanged: TBUILD / LibrariesPath point through
      # the %GITHUB_WORKSPACE%\TBuild symlink, so cache keys and every
      # downstream path stay byte-identical, and both jobs of this workflow
      # run the same image and therefore pick the same drive.
      - name: Pick the drive for TBuild (largest free space).
        shell: powershell
        run: |
          $c = (Get-PSDrive C).Free
          $d = 0
          if (Get-PSDrive D -ErrorAction SilentlyContinue) { $d = (Get-PSDrive D).Free }
          Write-Host ("Free space: C: {0:N1} GB | D: {1:N1} GB" -f ($c/1GB), ($d/1GB))
          if ($d -gt $c) { $real = 'D:\TBuild' } else { $real = Join-Path $env:USERPROFILE 'TBuild' }
          New-Item -ItemType Directory -Force -Path (Join-Path $real 'Libraries') | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "TBUILD_REAL=$real"
          Write-Host "TBuild will live on: $real"

      - name: Prepare directories.
        run: |
          if not exist "%TBUILD_REAL%\Libraries" mkdir "%TBUILD_REAL%\Libraries"
          if exist "%GITHUB_WORKSPACE%\TBuild" rmdir "%GITHUB_WORKSPACE%\TBuild"
          mklink /d "%GITHUB_WORKSPACE%\TBuild" "%TBUILD_REAL%"
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Clone official tdesktop (dev).
        run: |
          git -c core.autocrlf=false clone --depth 1 --filter=blob:none --recurse-submodules --shallow-submodules https://github.com/telegramdesktop/tdesktop.git %TBUILD%\tdesktop

      # Upstream Windows links breakpad for crash reports, but the breakpad
      # prepare stage builds `dump_syms` via MSBuild with the v143 toolset,
      # and the windows-latest image (VS 2026) has NO ATL for v143 -> C1083
      # 'atlbase.h' not found. The build configures with
      # -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON so cmake_helpers skips the
      # breakpad link target entirely; deleting the stage here makes both
      # the named-stage pass AND a full `win.bat silent` prepare skip it.
      # (Renaming alone is NOT enough — filterByPlatform still registers it.)
      # The script ALSO trims the Qt 6 stage to Release-only (run 8 disk death).
      - name: Patch prepare.py (drop breakpad, Release-only Qt).
        run: |
          python %GITHUB_WORKSPACE%\patches\remove-breakpad-stage.py %TBUILD%\tdesktop\Telegram\build\prepare\prepare.py

      # Same run_cmake.py toolset patch as the build job (see comment there).
      # Library stages build with the env cl via jom/Ninja, but keeping the
      # helper consistent protects any stage that ever uses a VS generator.
      - name: Patch run_cmake.py (toolset follows env VCToolsVersion).
        run: |
          python %GITHUB_WORKSPACE%\patches\pin-run-cmake-toolset.py %TBUILD%\tdesktop\cmake\run_cmake.py
          findstr /C:"VCToolsVersion" %TBUILD%\tdesktop\cmake\run_cmake.py >nul || exit /b 1

      - name: Compute cache key (prepare scripts hash + week number).
        shell: bash
        run: |
          WEEK=$(date +%G-W%V)
          WS=$(cygpath -u "$GITHUB_WORKSPACE")
          PREP="$WS/TBuild/tdesktop/Telegram/build/prepare"
          CACHE_KEY=$(cat "$PREP/prepare.py" "$PREP/win.bat" "$PREP/msvc.py" 2>/dev/null | sha256sum | awk '{ print $1 }')
          if [ -z "$CACHE_KEY" ]; then CACHE_KEY="fallback-$WEEK"; fi
          echo "WEEK=$WEEK" >> $GITHUB_ENV
          echo "CACHE_KEY=$CACHE_KEY" >> $GITHUB_ENV

      - name: Native Tools Command Prompt.
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: Restore ThirdParty cache.
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: win-tdesktop-thirdparty-${{ env.CACHE_KEY }}-${{ env.WEEK }}-${{ github.run_id }}-attempt${{ github.run_attempt }}
          # Bare-prefix fallback: patch-only edits shift CACHE_KEY, but the
          # per-stage content keys stored INSIDE the cache keep every other
          # stage valid (prepare.py skips stages whose cache_key matches).
          restore-keys: |
            win-tdesktop-thirdparty-${{ env.CACHE_KEY }}-
            win-tdesktop-thirdparty-

      - name: Restore Libraries cache (base, without Qt).
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t_*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t_*
          key: win-tdesktop-libs-base-${{ env.CACHE_KEY }}-${{ env.WEEK }}-${{ github.run_id }}-attempt${{ github.run_attempt }}
          restore-keys: |
            win-tdesktop-libs-base-${{ env.CACHE_KEY }}-
            win-tdesktop-libs-base-

      # All win64 stages except xz/libiconv (mac-only) and the Qt trio
      # (qt6_windows7, tg_angle, qt_*). NOTE: upstream has NO `crashpad`
      # stage on Windows (mac-only) and breakpad was deleted above — the
      # crash client is disabled via DESKTOP_APP_DISABLE_CRASH_REPORTS.
      # If upstream renames a stage, the fallback below runs a full prepare.
      # IMPORTANT: when stage names are passed, prepare.py sets checkResult
      # to 'Forced' and rebuilds them with the cache BYPASSED (see runStages
      # in prepare.py). So only run the explicit list when the base cache is
      # genuinely absent (sentinel: cache_keys\tdesktop_rust, the last base
      # stage); otherwise go straight to the full prepare, which SKIPS every
      # stage whose cache key is still valid.
      - name: Libraries (base stages).
        run: |
          if not exist %LibrariesPath%\cache_keys\tdesktop_rust (
            call %TBUILD%\tdesktop\Telegram\build\prepare\win.bat silent patches msys64 python NuGet jom rust lzma zlib mozjpeg openssl3 opus rnnoise gas-preprocessor dav1d openh264 libavif libwebp libjxl libvpx liblcms2 nv-codec-headers regex ffmpeg libheif openal-soft tg_owt ada tde2e tlottie wallet-engine tdesktop_rust
          ) else (
            echo Base cache restored, skipping forced base rebuild.
          )
          if %errorlevel% neq 0 (
            echo Base stage list failed, running full prepare instead...
            call %TBUILD%\tdesktop\Telegram\build\prepare\win.bat silent
          )

      # Runs the FORCED (cache-bypassed) rebuild of the Rust stages.
      # Caches saved by runs <= 10 had their sources stripped by the old
      # trim (out/src/wallet_engine/wallet_engine.cpp gone, .rs/.toml of
      # tlottie + wallet-engine gone) while the stage keys stayed valid, so
      # a plain prepare would SKIP them and the build job would fail with
      # "Cannot find source file: .../tdesktop_rust/out/src/wallet_engine/
      # wallet_engine.cpp" (run 10). Forced rebuilds re-clone tlottie and
      # wallet-engine and regenerate tdesktop_rust/out completely; the keys
      # are rewritten with the same values, so later runs skip them again.
      - name: Rebuild Rust stages over the damaged cache.
        run: |
          call %TBUILD%\tdesktop\Telegram\build\prepare\win.bat silent tlottie wallet-engine tdesktop_rust

      # 64Gram-proven trim: only build junk is deleted. The previous
      # aggressive keep-list trim deleted generated .cpp glue and library
      # sources that the Telegram build compiles directly from Libraries
      # (run 10 failure) — do NOT bring it back.
      # Run 11 lesson: right after the rebuild, Windows/Defender still holds
      # handles on the freshly written .git dirs, so `find -delete` fails
      # with "Directory not empty" and the step died AFTER the 15-minute
      # rebuild but BEFORE the cache save. Make the trim best-effort:
      # retry with sleeps and never fail — a leftover .git dir costs a few
      # hundred MB of cache, a failed step costs the whole run.
      # Run 12 lesson: the INSTALLED static Qt (Qt-6.11.2) contains REAL
      # .obj files (lib/objects-RelWithDebInfo/...) that Qt6GuiTargets.cmake
      # references via imported targets like Qt6::Gui_resources_1. Trimming
      # every *.obj destroyed the install and the build job's configure died
      # with "but this file does not exist". The install tree (Qt-6.*,
      # hyphen) is now EXCLUDED everywhere; the Qt BUILD tree (qt_6.11.2,
      # underscore) is still trimmed as before.
      - name: Free up some disk space (base).
        shell: bash
        run: |
          junk=( -name '*.obj' -o -name '*.pdb' -o -name '*.pch' -o -name '*.ilk' )
          keep='*/[qQ]t-6.*/*'
          for attempt in 1 2 3 4 5; do
            pending_f=$(find "$LibrariesPath" -type f '(' "${junk[@]}" ')' -not -path "$keep" -print -quit 2>/dev/null | wc -l)
            pending_d=$(find "$LibrariesPath" -depth -type d -name '.git' -print -quit 2>/dev/null | wc -l)
            if [ "$pending_f" = "0" ] && [ "$pending_d" = "0" ]; then break; fi
            echo "Trim attempt $attempt: $pending_f junk file(s) / $pending_d .git dir(s) pending..."
            find "$LibrariesPath" -type f '(' "${junk[@]}" ')' -not -path "$keep" -delete || true
            # NOTE: plain `-delete` can NEVER remove a non-empty .git: the
            # `-type d` filter keeps find from deleting the files inside, so
            # rmdir always gets ENOTEMPTY (run 11). rm -rf takes the whole
            # tree in one go and MSYS rm clears read-only attributes.
            find "$LibrariesPath" -depth -type d -name '.git' -exec rm -rf '{}' + || true
            sleep 10
          done
          exit 0

      - name: Save Libraries cache (base).
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t_*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t_*
          key: win-tdesktop-libs-base-${{ env.CACHE_KEY }}-${{ env.WEEK }}-${{ github.run_id }}-attempt${{ github.run_attempt }}

      # Qt 6 build (the longest stage). Already-built stages skip
      # internally via Libraries/win64/cache_keys.
      - name: Libraries (Qt).
        run: |
          call %TBUILD%\tdesktop\Telegram\build\prepare\win.bat silent

      # Same best-effort trim as the base step (see comment there).
      - name: Free up some disk space (Qt).
        shell: bash
        run: |
          junk=( -name '*.obj' -o -name '*.pdb' -o -name '*.pch' -o -name '*.ilk' )
          keep='*/[qQ]t-6.*/*'
          for attempt in 1 2 3 4 5; do
            pending_f=$(find "$LibrariesPath" -type f '(' "${junk[@]}" ')' -not -path "$keep" -print -quit 2>/dev/null | wc -l)
            pending_d=$(find "$LibrariesPath" -depth -type d -name '.git' -print -quit 2>/dev/null | wc -l)
            if [ "$pending_f" = "0" ] && [ "$pending_d" = "0" ]; then break; fi
            echo "Trim attempt $attempt: $pending_f junk file(s) / $pending_d .git dir(s) pending..."
            find "$LibrariesPath" -type f '(' "${junk[@]}" ')' -not -path "$keep" -delete || true
            find "$LibrariesPath" -depth -type d -name '.git' -exec rm -rf '{}' + || true
            sleep 10
          done
          exit 0

      - name: Save ThirdParty cache.
        uses: actions/cache/save@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: win-tdesktop-thirdparty-${{ env.CACHE_KEY }}-${{ env.WEEK }}-${{ github.run_id }}-attempt${{ github.run_attempt }}

      - name: Save Libraries cache (Qt).
        uses: actions/cache/save@v6
        with:
          # tg_angle is built together with Qt (full prepare) but is NOT
          # matched by the [qQ]t_* pattern; list it explicitly or the build
          # job would rebuild it from scratch.
          # [qQ]t-* is the INSTALLED Qt (Libraries/win64/Qt-6.11.2) — the
          # run 9 failure was exactly this folder missing from the cache,
          # because [qQ]t_* only matches the qt_6.11.2 source/build tree.
          path: |
            ${{ env.LibrariesPath }}\[qQ]t_*
            ${{ env.LibrariesPath }}\[qQ]t-*
            ${{ env.LibrariesPath }}\tg_angle*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t_*
            ${{ env.LibrariesPath }}\cache_keys\tg_angle*
          key: win-tdesktop-libs-qt-${{ env.CACHE_KEY }}-${{ env.WEEK }}-${{ github.run_id }}-attempt${{ github.run_attempt }}

  # ---------------------------------------------------------------
  # Job 2: clone upstream, apply the unlimited-accounts patch,
  # configure and build Telegram.exe (Release x64), upload artifact.
  # ---------------------------------------------------------------
  build:
    name: Build (Release x64)
    needs: libraries
    runs-on: windows-latest
    timeout-minutes: 350
    defaults:
      run:
        shell: cmd
    steps:

      - name: Checkout this repository (for the patch).
        uses: actions/checkout@v7

      # Same runner-image trim as in the libraries job (see comment there).
      - name: Free up disk space on the runner.
        shell: powershell
        run: |
          $before = [math]::Round((Get-PSDrive C).Free / 1GB, 1)
          Write-Host "Free space on C: before cleanup: $before GB"
          $targets = @(
            'C:\Program Files\Android',
            'C:\Program Files (x86)\Android',
            'C:\Users\runneradmin\AppData\Local\Android',
            'C:\hostedtoolcache\windows\go',
            'C:\hostedtoolcache\windows\Ruby',
            'C:\hostedtoolcache\windows\PyPy',
            'C:\hostedtoolcache\windows\stack',
            'C:\hostedtoolcache\windows\ghc',
            'C:\hostedtoolcache\windows\CodeQL',
            'C:\hostedtoolcache\windows\Java_Temurin-Hotspot_jdk*',
            'C:\hostedtoolcache\windows\dotnet',
            'C:\ProgramData\DockerDesktop',
            'C:\Users\runneradmin\.docker',
            'C:\Program Files\Mozilla Firefox',
            'C:\Program Files (x86)\Mozilla Firefox',
            'C:\Program Files\Google\Chrome',
            'C:\Program Files (x86)\Google\Chrome',
            'C:\Program Files\MySQL',
            'C:\ProgramData\MySQL',
            'C:\Program Files\PostgreSQL',
            'C:\ProgramData\PostgreSQL',
            'C:\Users\runneradmin\.rustup',
            'C:\Users\runneradmin\.cargo',
            'C:\Users\runneradmin\.gradle',
            'C:\Users\runneradmin\.m2',
            'C:\Users\runneradmin\.npm',
            'C:\Users\runneradmin\.nuget',
            'C:\ProgramData\Microsoft Visual Studio\Packages',
            'C:\Users\runneradmin\AppData\Local\Docker',
            'C:\ProgramData\chocolatey',
            'C:\SeleniumWebDrivers',
            'C:\ghcup',
            'C:\cabal',
            'C:\mingw64',
            'C:\vcpkg',
            'C:\Strawberry',
            'C:\Users\runneradmin\AppData\Local\wsl',
            'C:\Users\runneradmin\AppData\Local\Packages\CanonicalGroupLimited*',
            'C:\Users\runneradmin\AppData\Local\pip\cache',
            'C:\Users\runneradmin\AppData\Local\Google\Chrome',
            'C:\ProgramData\Google',
            'C:\ProgramData\Mozilla'
          )
          foreach ($t in $targets) {
            if (Test-Path $t) {
              try {
                Remove-Item -Recurse -Force $t -ErrorAction Stop
                Write-Host "removed: $t"
              } catch {
                Write-Host "could not remove ${t}: $($_.Exception.Message)"
              }
            }
          }
          $after = [math]::Round((Get-PSDrive C).Free / 1GB, 1)
          Write-Host "Free space on C: after cleanup: $after GB (freed $([math]::Round($after - $before, 1)) GB)"

      # Run 16 died with C1085/MSB6003 "No space left on device" deep inside
      # Telegram.vcxproj: even after the trim C: had only 42 GB free and the
      # main build consumed ALL of it. The runner also exposes a large data
      # drive (D: — the workspace itself lives there), so put the REAL
      # TBuild tree on whichever drive currently has more free space. The
      # env vars below are unchanged: TBUILD / LibrariesPath point through
      # the %GITHUB_WORKSPACE%\TBuild symlink, so cache keys and every
      # downstream path stay byte-identical, and both jobs of this workflow
      # run the same image and therefore pick the same drive.
      - name: Pick the drive for TBuild (largest free space).
        shell: powershell
        run: |
          $c = (Get-PSDrive C).Free
          $d = 0
          if (Get-PSDrive D -ErrorAction SilentlyContinue) { $d = (Get-PSDrive D).Free }
          Write-Host ("Free space: C: {0:N1} GB | D: {1:N1} GB" -f ($c/1GB), ($d/1GB))
          if ($d -gt $c) { $real = 'D:\TBuild' } else { $real = Join-Path $env:USERPROFILE 'TBuild' }
          New-Item -ItemType Directory -Force -Path (Join-Path $real 'Libraries') | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "TBUILD_REAL=$real"
          Write-Host "TBuild will live on: $real"

      - name: Prepare directories.
        run: |
          if not exist "%TBUILD_REAL%\Libraries" mkdir "%TBUILD_REAL%\Libraries"
          if exist "%GITHUB_WORKSPACE%\TBuild" rmdir "%GITHUB_WORKSPACE%\TBuild"
          mklink /d "%GITHUB_WORKSPACE%\TBuild" "%TBUILD_REAL%"
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Clone official tdesktop (dev, recursive shallow submodules).
        run: |
          git -c core.autocrlf=false clone --depth 1 --shallow-submodules --recurse-submodules https://github.com/telegramdesktop/tdesktop.git %TBUILD%\tdesktop

      # Same prepare.py patch as the libraries job (see comment there).
      - name: Patch prepare.py (drop breakpad, Release-only Qt).
        run: |
          python %GITHUB_WORKSPACE%\patches\remove-breakpad-stage.py %TBUILD%\tdesktop\Telegram\build\prepare\prepare.py

      # cmake_helpers' PINNED run_cmake.py appends `-T v143` unconditionally
      # (it predates the explicit-toolset handling of master). On the
      # windows-2025-vs2026 image `v143` resolves to MSVC 14.44 while every
      # cached library was built with the env toolset MSVC 14.51 — the
      # mismatch killed the codegen links with LNK2019 __std_* (run 14),
      # and passing our own -T on the configure line died with
      # "Multiple -T options not allowed" (run 15). Patch the helper so
      # the toolset follows env VCToolsVersion instead (see the patch).
      - name: Patch run_cmake.py (toolset follows env VCToolsVersion).
        run: |
          python %GITHUB_WORKSPACE%\patches\pin-run-cmake-toolset.py %TBUILD%\tdesktop\cmake\run_cmake.py
          findstr /C:"VCToolsVersion" %TBUILD%\tdesktop\cmake\run_cmake.py >nul || exit /b 1

      # Run 17 fix (64Gram CI recipe): without this, cmake_helpers forces
      # CMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded for Release -> /Z7 in
      # every object -> final link LNK1102 out of memory + disk bloat
      # (run 16). The -D flag below (added to configure) is the primary fix;
      # this sed only strips the ${_Zi} fallback from CMake's default flag
      # tables. Non-fatal: if CMake's layout changed, the -D still holds.
      - name: Strip /Zi defaults from CMake MSVC module (run 17 fix).
        shell: bash
        run: |
          F=$(ls "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake 2>/dev/null | head -1)
          if [ -n "$F" ] && grep -q '_Zi' "$F"; then
            sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$F"
            if grep -q 'FLAGS_DEBUG_INIT.*_Zi' "$F"; then
              echo "WARNING: ${_Zi} still present after sed"
            else
              echo "Windows-MSVC.cmake patched: ${_Zi} removed from DEBUG_INIT"
            fi
          else
            echo "Windows-MSVC.cmake not found or already clean; relying on the -D flag"
          fi

      - name: Apply unlimited-accounts patch.
        run: |
          git -C %TBUILD%\tdesktop apply --whitespace=nowarn %GITHUB_WORKSPACE%\patches\unlimited-accounts.patch || python -c "import io,re;p=r'%TBUILD%\tdesktop\Telegram\SourceFiles\main\main_domain.h';s=io.open(p,encoding='utf-8').read();s=re.sub(r'static constexpr auto kMaxAccounts = \d+;','static constexpr auto kMaxAccounts = 999;',s);s=re.sub(r'static constexpr auto kPremiumMaxAccounts = \d+;','static constexpr auto kPremiumMaxAccounts = 1000;',s);io.open(p,'w',encoding='utf-8',newline='').write(s)"

      - name: Verify patch applied.
        run: |
          findstr /C:"kMaxAccounts = 999" %TBUILD%\tdesktop\Telegram\SourceFiles\main\main_domain.h || exit /b 1
          findstr /C:"kPremiumMaxAccounts = 1000" %TBUILD%\tdesktop\Telegram\SourceFiles\main\main_domain.h || exit /b 1

      - name: Compute cache key (prepare scripts hash + week number).
        shell: bash
        run: |
          WEEK=$(date +%G-W%V)
          WS=$(cygpath -u "$GITHUB_WORKSPACE")
          PREP="$WS/TBuild/tdesktop/Telegram/build/prepare"
          CACHE_KEY=$(cat "$PREP/prepare.py" "$PREP/win.bat" "$PREP/msvc.py" 2>/dev/null | sha256sum | awk '{ print $1 }')
          if [ -z "$CACHE_KEY" ]; then CACHE_KEY="fallback-$WEEK"; fi
          echo "WEEK=$WEEK" >> $GITHUB_ENV
          echo "CACHE_KEY=$CACHE_KEY" >> $GITHUB_ENV

      - name: Native Tools Command Prompt.
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: Restore ThirdParty cache.
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: win-tdesktop-thirdparty-not-used-${{ github.run_id }}
          restore-keys: |
            win-tdesktop-thirdparty-${{ env.CACHE_KEY }}-
            win-tdesktop-thirdparty-

      - name: Restore Libraries cache (base, without Qt).
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t_*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t_*
          key: win-tdesktop-libs-base-not-used-${{ github.run_id }}
          restore-keys: |
            win-tdesktop-libs-base-${{ env.CACHE_KEY }}-
            win-tdesktop-libs-base-

      - name: Restore Libraries cache (Qt).
        uses: actions/cache/restore@v6
        with:
          # [qQ]t-* restores the INSTALLED Qt dir (Qt-6.11.2); without it the
          # run 9 build job failed: "Neither Qt6 nor Qt5 is found".
          path: |
            ${{ env.LibrariesPath }}\[qQ]t_*
            ${{ env.LibrariesPath }}\[qQ]t-*
            ${{ env.LibrariesPath }}\tg_angle*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t_*
            ${{ env.LibrariesPath }}\cache_keys\tg_angle*
          key: win-tdesktop-libs-qt-not-used-${{ github.run_id }}
          restore-keys: |
            win-tdesktop-libs-qt-${{ env.CACHE_KEY }}-
            win-tdesktop-libs-qt-

      # Run 12 auto-heal: the Qt cache saved by runs <= 12 lost the static
      # Qt resource objects (lib/objects-RelWithDebInfo/**/*.obj) to the old
      # trim, so configure dies at Qt6::Gui_resources_1. If the restored
      # install is damaged, delete the Qt trio cache keys so the next step
      # (Sync libraries) force-rebuilds them instead of SKIPPING into the
      # same configure failure.
      - name: Verify restored Qt install (auto-heal if damaged).
        shell: bash
        run: |
          LP=$(cygpath -u "$LibrariesPath")
          if ! ls "$LP"/[qQ]t-6.*/lib/cmake/Qt6Gui/Qt6GuiTargets.cmake >/dev/null 2>&1; then
            echo "WARNING: Qt-6.* install (Qt6GuiTargets.cmake) NOT found in restored cache."
            echo "Sync libraries will rebuild the Qt trio from scratch."
            rm -fv "$LP"/cache_keys/[qQ]t* "$LP"/cache_keys/tg_angle*
            exit 0
          fi
          if [ -z "$(find "$LP" -type d -path '*/objects-RelWithDebInfo' -print -quit 2>/dev/null)" ]; then
            echo "Restored Qt has no objects-RelWithDebInfo dir — older Qt layout, nothing to verify."
            exit 0
          fi
          n=$(find "$LP" -type f -path '*/objects-RelWithDebInfo/*' -name '*.obj' -print -quit 2>/dev/null | wc -l)
          if [ "$n" = "0" ]; then
            echo "Restored Qt install is DAMAGED: resource .obj files missing (run 12 failure mode)."
            echo "Deleting Qt trio cache keys so Sync libraries rebuilds them..."
            rm -fv "$LP"/cache_keys/[qQ]t* "$LP"/cache_keys/tg_angle*
            exit 0
          fi
          echo "Restored Qt install verified: resource objects present."

      - name: Sync libraries (skips everything already cached).
        run: |
          call %TBUILD%\tdesktop\Telegram\build\prepare\win.bat silent

      - name: Telegram Desktop build (Release x64).
        run: |
          cd %TBUILD%\tdesktop\Telegram

          rem The toolset mismatch (libs 14.51 vs -T v143 -> 14.44) is fixed
          rem earlier: patches/pin-run-cmake-toolset.py rewrote run_cmake.py
          rem to emit `-T version=%VCToolsVersion%`. Guard here so a missing
          rem env fails fast instead of reproducing the run 14 LNK2019.
          if "%VCToolsVersion%"=="" (
            echo ERROR: VCToolsVersion is not set; msvc-dev-cmd must run first.
            exit /b 1
          )
          echo Final build will use MSVC toolset version %VCToolsVersion%.

          call configure.bat x64 ^
            -D TDESKTOP_API_ID=%TDESKTOP_API_ID% ^
            -D TDESKTOP_API_HASH=%TDESKTOP_API_HASH% ^
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON ^
            -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
            -D CMAKE_CONFIGURATION_TYPES=Release

          cmake --build ..\out --config Release --parallel

      - name: Collect artifact.
        run: |
          set OUT=%TBUILD%\tdesktop\out\Release
          mkdir %GITHUB_WORKSPACE%\artifact
          move %OUT%\Telegram.exe %GITHUB_WORKSPACE%\artifact\
          if exist %OUT%\Updater.exe move %OUT%\Updater.exe %GITHUB_WORKSPACE%\artifact\
          powershell -NoProfile -Command "Compress-Archive -Path '%GITHUB_WORKSPACE%\artifact\*' -DestinationPath '%GITHUB_WORKSPACE%\Telegram-unlimited-accounts-win64.zip' -Force"

      - uses: actions/upload-artifact@v7
        name: Upload artifact.
        with:
          name: windows-exe
          path: ${{ github.workspace }}\Telegram-unlimited-accounts-win64.zip
          retention-days: 14
          if-no-files-found: error
